[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-monitor"
version = "0.8.0"
description = "Small local monitor for long-running AI agent work"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "il-piccola" }
]
dependencies = []

[project.scripts]
monitor = "ai_agent_monitor.app:main"
ai-agent-monitor = "ai_agent_monitor.app:main"

[tool.setuptools.packages.find]
include = ["ai_agent_monitor*"]

[tool.setuptools.package-data]
ai_agent_monitor = ["dashboard.html"]
