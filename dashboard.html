<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 48px auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
    }

    .subtitle {
      margin: 0;
      color: GrayText;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .card {
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 14px;
      padding: 20px;
      background: color-mix(in srgb, Canvas 96%, CanvasText 4%);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .empty {
      margin: 0;
      color: GrayText;
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 999px;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Agent Monitor</h1>
      <p class="subtitle">Local view of an AI agent's current work.</p>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Current task</h2>
        <p class="empty">No active task.</p>
      </section>

      <section class="card">
        <h2>Recent progress</h2>
        <p class="empty">No progress has been recorded yet.</p>
      </section>

      <section class="card">
        <h2>Questions</h2>
        <span class="status">0 unanswered</span>
      </section>
    </div>
  </main>
</body>
</html>
