<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Agent Monitor</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 48px auto;
    }

    header {
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 5vw, 2.5rem);
    }

    .subtitle {
      margin: 0;
      color: GrayText;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .card {
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 14px;
      padding: 20px;
      background: color-mix(in srgb, Canvas 96%, CanvasText 4%);
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .empty,
    .timestamp,
    .load-error {
      color: GrayText;
    }

    .empty {
      margin: 0;
    }

    .load-error {
      margin: 12px 0 0;
      font-size: 0.9rem;
    }

    .status {
      display: inline-block;
      padding: 4px 9px;
      border: 1px solid color-mix(in srgb, CanvasText 20%, transparent);
      border-radius: 999px;
      font-size: 0.85rem;
    }

    .progress-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .progress-list li {
      padding: 12px 0;
      border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
    }

    .progress-list li:first-child {
      padding-top: 0;
      border-top: 0;
    }

    .message {
      display: block;
      overflow-wrap: anywhere;
    }

    .timestamp {
      display: block;
      margin-top: 4px;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>AI Agent Monitor</h1>
      <p class="subtitle">Local view of an AI agent's current work.</p>
    </header>

    <div class="grid">
      <section class="card">
        <h2>Current task</h2>
        <p class="empty">No active task.</p>
      </section>

      <section class="card">
        <h2>Recent progress</h2>
        <p id="progress-empty" class="empty">No progress has been recorded yet.</p>
        <ul id="progress-list" class="progress-list" hidden></ul>
        <p id="progress-error" class="load-error" hidden>
          Progress could not be loaded. The monitor will try again automatically.
        </p>
      </section>

      <section class="card">
        <h2>Questions</h2>
        <span class="status">0 unanswered</span>
      </section>
    </div>
  </main>

  <script>
    const progressList = document.querySelector("#progress-list");
    const progressEmpty = document.querySelector("#progress-empty");
    const progressError = document.querySelector("#progress-error");

    function formatTimestamp(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) {
        return value;
      }
      return new Intl.DateTimeFormat(undefined, {
        dateStyle: "short",
        timeStyle: "medium",
      }).format(date);
    }

    function renderProgress(items) {
      progressList.replaceChildren();

      if (items.length === 0) {
        progressList.hidden = true;
        progressEmpty.hidden = false;
        return;
      }

      for (const item of items) {
        const row = document.createElement("li");
        const message = document.createElement("span");
        const timestamp = document.createElement("time");

        message.className = "message";
        message.textContent = item.message;

        timestamp.className = "timestamp";
        timestamp.dateTime = item.created_at;
        timestamp.textContent = formatTimestamp(item.created_at);

        row.append(message, timestamp);
        progressList.append(row);
      }

      progressEmpty.hidden = true;
      progressList.hidden = false;
    }

    async function refreshProgress() {
      try {
        const response = await fetch("/api/progress", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const payload = await response.json();
        renderProgress(Array.isArray(payload.progress) ? payload.progress : []);
        progressError.hidden = true;
      } catch (error) {
        progressError.hidden = false;
      }
    }

    refreshProgress();
    setInterval(refreshProgress, 3000);
  </script>
</body>
</html>
